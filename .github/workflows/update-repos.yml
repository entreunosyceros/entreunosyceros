name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Ejecución manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import requests

          LANG_EMOJIS = {
              'Python': '🐍 Python',
              'Java': '☕ Java',
              'C': '⚙️ C',
              'C++': '🧪 C++',
              'PHP': '🐘 PHP',
              'Go': '🐹 Go',
              'Shell': '🐚 Bash/Shell',
              'JavaScript': '🌐 JavaScript',
              'TypeScript': '📘 TypeScript',
              'HTML': '📄 HTML5',
              'CSS': '🎨 CSS3',
              'JSON': '🗂️ JSON',
              'Markdown': '📝 Markdown',
              'SQL': '🛢️ MySQL/SQL'
          }

          try:
              url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
              repos = requests.get(url).json()
              
              table = '\n| Proyecto | Tecnología | Descripción |\n| :--- | :---: | :--- |\n'
              for repo in repos:
                  name = repo['name']
                  u = repo['html_url']
                  lang = repo.get('language')
                  desc = repo['description'] if repo['description'] else 'Sin descripción.'
                  desc = desc.replace('\n', ' ').replace('\r', '').replace('|', '\\|')
                  
                  # Si el lenguaje es C++, lo renombramos internamente para evitar conflictos con el diccionario
                  if lang == 'C++':
                      emoji = '🧪 C++'
                  else:
                      emoji = LANG_EMOJIS.get(lang, f'💻 {lang}') if lang else '📦 Otros'
                      
                  table += f'| [**{name}**]({u}) | {emoji} | {desc} |\n'
              table += '\n'

              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()
              
              start = ''
              end = ''
              
              if start in readme and end in readme:
                  before = readme.split(start)[0]
                  after = readme.split(end)[1]
                  new_readme = before + start + table + end + after
                  with open('README.md', 'w', encoding='utf-8') as f:
                      f.write(new_readme)
                  print('Cambios aplicados con éxito')
              else:
                  print('Etiquetas ausentes')
          except Exception as e:
              print(f'Error interno: {e}')
          "

      - name: Hacer Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "🤖 Mantenimiento: Tabla de proyectos actualizada" && git push)
