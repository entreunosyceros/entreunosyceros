name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Ejecución manual

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import requests
          import os
          import sys
          import re

          # 1. Obtener los datos de GitHub
          url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
          headers = {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"}
          
          try:
              res = requests.get(url, headers=headers)
              res.raise_for_status()
              repos = res.json()
          except Exception as e:
              print(f"❌ Error al consultar la API de GitHub: {e}")
              sys.exit(1)
          
          # 2. Construir la tabla Markdown
          table_lines = [
              '',
              '| Proyecto | Descripción |',
              '| :--- | :--- |'
          ]
          
          for repo in repos:
              desc = repo['description'] if repo['description'] else 'Sin descripción.'
              desc = desc.replace('\n', ' ').replace('\r', '').replace('|', '\\|')
              row = f"| [**{repo['name']}**]({repo['html_url']}) | {desc} |"
              table_lines.append(row)
          
          table_lines.append('')
          table_content = '\n'.join(table_lines)

          # 3. Leer el README actual
          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()
          
          # LIMPIEZA PREVENTIVA: Si la tabla rota se quedó atrapada arriba del todo,
          # la eliminamos usando expresiones regulares antes de proceder.
          readme = re.sub(r'^\| Proyecto \| Descripción \|\s*\n\| :--- \| :--- \|\s*\n(?:\|.*\|\s*\n)*', '', readme)

          # 4. Inyectar la tabla entre los marcadores correctos usando Regex
          pattern = r'(<!-- LATEST-REPOS-START -->)(.*?)(<!-- LATEST-REPOS-END -->)'
          
          if re.search(pattern, readme, re.DOTALL):
              # Reemplazamos el bloque central con nuestra tabla limpia
              new_readme = re.sub(pattern, f"\\1{table_content}\\3", readme, flags=re.DOTALL)
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
              print("✅ README modificado con éxito usando Regex.")
          else:
              print("❌ Error crítico: No se encontraron las etiquetas <!-- LATEST-REPOS-START --> y <!-- LATEST-REPOS-END --> abajo.")
              sys.exit(1)
          PY

      - name: Configurar Git de forma limpia
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Comprobar cambios y subir al repositorio
        run: |
          git add README.md
          echo "Mantenimiento: Tabla de proyectos actualizada" > commit_msg.txt
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -F commit_msg.txt && git push)
          rm -f commit_msg.txt
