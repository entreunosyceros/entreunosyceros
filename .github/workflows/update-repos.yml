name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Execution manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import requests

          # 1. Obtener datos limpios de la API de GitHub
          url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
          repos = requests.get(url).json()
          
          # Inicializamos la tabla con comillas simples (Cero conflictos con Bash)
          lines = [
              '',
              '| Proyecto | Descripción |',
              '| :--- | :--- |'
          ]
          
          for repo in repos:
              desc = repo['description'] if repo['description'] else 'Sin descripción.'
              desc = desc.replace('\n', ' ').replace('\r', '').replace('|', '\\|')
              
              # Extraemos los datos en variables independientes para evitar las comillas dobles escapadas dentro de los f-strings
              name = repo['name']
              html_url = repo['html_url']
              
              # Construimos la fila de la tabla de forma limpia
              row = '| [**' + name + '**](' + html_url + ') | ' + desc + ' |'
              lines.append(row)
          
          lines.append('')
          content_string = '\n'.join(lines)

          # 2. Leer el README completo
          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()
          
          # 3. Reemplazo seguro mediante split de bloques
          start_tag = ''
          end_tag = ''
          
          if start_tag in readme and end_tag in readme:
              before_part = readme.split(start_tag)[0]
              after_part = readme.split(end_tag)[1]
              
              new_readme = before_part + start_tag + content_string + end_tag + after_part
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
          else:
              print('Error: No se encontraron las etiquetas de bloque en el README.md')
          "

      - name: Hacer Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "🤖 Ma
