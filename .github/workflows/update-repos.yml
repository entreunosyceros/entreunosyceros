name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Ejecución manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import requests

          # 1. Obtener los repositorios desde la API
          url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
          repos = requests.get(url).json()
          
          lines_to_inject = []
          for repo in repos:
              desc = repo['description'] if repo['description'] else 'Sin descripción.'
              lines_to_inject.append(f\"* [**{repo['name']}**]({repo['html_url']}) - {desc}\n\")
          
          content_string = \"\".join(lines_to_inject)

          # 2. Leer el README línea por línea de forma segura
          with open('README.md', 'r', encoding='utf-8') as f:
              readme_lines = f.readlines()
          
          new_readme = []
          inside_section = False
          
          for line in readme_lines:
              if '' in line:
                  new_readme.append(line)
                  new_readme.append(content_string)
                  inside_section = True
                  continue
              if '' in line:
                  inside_section = False
              
              if not inside_section:
                  new_readme.append(line)
          
          # 3. Guardar el resultado blindado
          with open('README.md', 'w', encoding='utf-8') as f:
              f.writelines(new_readme)
          "

      - name: Hacer Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "🤖 Mantenimiento: Últimos repositorios actualizados" && git push)
