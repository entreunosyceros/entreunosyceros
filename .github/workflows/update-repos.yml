name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Ejecución manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Colocamos aquí la variable para que afecte directamente a los runners de las acciones
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import requests, re

          url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
          repos = requests.get(url).json()
          
          lines = []
          for repo in repos:
              desc = repo['description'] if repo['description'] else 'Sin descripción.'
              lines.append(f\"* [**{repo['name']}**]({repo['html_url']}) - {desc}\")
          
          content = '\n'.join(lines)
          
          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()
          
          pattern = r'(<!-- START_SECTION:github-stats -->)(.*?)(<!-- END_SECTION:github-stats -->)'
          updated_readme = re.sub(pattern, f'\\1\n{content}\n\\3', readme, flags=re.DOTALL)
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_readme)
          "

      - name: Hacer Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "🤖 Mantenimiento: Últimos repositorios actualizados" && git push)
