name: Actualizar Últimos Repositorios

on:
  schedule:
    - cron: '0 0 * * *' # Cada 24 horas
  workflow_dispatch: # Ejecución manual

# Permisos explícitos para que la Action pueda modificar el repositorio
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener repositorios modificados desde la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import requests
          import os
          import sys

          # 1. Configurar la petición autenticada a la API de GitHub
          url = 'https://api.github.com/users/entreunosyceros/repos?sort=pushed&per_page=5'
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
          }
          
          try:
              res = requests.get(url, headers=headers)
              res.raise_for_status()
              repos = res.json()
          except Exception as e:
              print(f"❌ Error al consultar la API de GitHub: {e}")
              sys.exit(1)
          
          # 2. Inicializar la estructura de la tabla
          lines = [
              '',
              '| Proyecto | Descripción |',
              '| :--- | :--- |'
          ]
          
          for repo in repos:
              desc = repo['description'] if repo['description'] else 'Sin descripción.'
              desc = desc.replace('\n', ' ').replace('\r', '').replace('|', '\\|')
              
              name = repo['name']
              html_url = repo['html_url']
              
              row = f"| [**{name}**]({html_url}) | {desc} |"
              lines.append(row)
          
          lines.append('')
          content_string = '\n'.join(lines)

          # 3. Leer el README completo
          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()
          
          # Marcadores REALES y asignados correctamente
          start_tag = ''
          end_tag = ''
          
          # 4. Reemplazo ultra seguro usando índices de posición para evitar fallos de duplicados
          if start_tag in readme and end_tag in readme:
              start_index = readme.index(start_tag) + len(start_tag)
              end_index = readme.index(end_tag)
              
              new_readme = (
                  readme[:start_index]
                  + content_string
                  + readme[end_index:]
              )
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
              print("✅ README modificado con éxito usando el bloque de índices.")
          else:
              print(f"❌ Error: No se encontraron los marcadores {start_tag} o {end_tag} en tu README.md")
              sys.exit(1)
          PY

      - name: Hacer Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "🤖 Mante
